<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meal Cheat</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="theme-color" content="#0e1116">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-CXT9Uuvb.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-mchnsmkM.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <canvas class="ic3d" data-icon="panda" width="56" height="56" style="width:28px;height:28px" aria-hidden="true"></canvas>
        <span class="brand-name">Meal Cheat</span>
      </div>
      <div class="top-actions">
        <button type="button" id="whoBtn" class="budget-pill" data-action="open-family" aria-label="Who is eating?"></button>
        <button type="button" id="petChip" class="budget-pill" data-action="go-garden" aria-label="Open panda garden"></button>
        <button type="button" id="budgetPill" class="budget-pill" data-action="open-settings" aria-label="Budget summary"></button>
        <button type="button" class="icon-pill" data-action="open-settings" aria-label="Settings and budget">
          <canvas class="ic3d" data-icon="gear" width="44" height="44" style="width:22px;height:22px" aria-hidden="true"></canvas>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap" id="view"></div>
  </main>

  <nav class="tabbar" aria-label="Primary sections">
    <div class="wrap tabbar-grid">
      <button type="button" data-tab="eat" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12h18a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8z"/>
          <path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/>
        </svg>
        <span>Eat</span>
      </button>
      <button type="button" data-tab="recipes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>Recipes</span>
      </button>
      <button type="button" data-tab="shop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/>
          <circle cx="10" cy="20" r="1.4"/>
          <circle cx="17" cy="20" r="1.4"/>
        </svg>
        <span>Shop</span>
      </button>
      <button type="button" data-tab="explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>Explore</span>
      </button>
      <button type="button" data-tab="garden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 21V6M12 21V3M17 21V9"/>
          <path d="M7 12c-2-1-3-3-3-3s2-1 3 1M12 9c2-1 3-3 3-3s-2-1-3 1M17 14c2-1 3-3 3-3s-2-1-3 1"/>
        </svg>
        <span>Garden</span>
      </button>
    </div>
  </nav>

  <div id="cookOverlay" class="overlay-sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="modalRoot" class="modal-backdrop" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

</body>
</html>
