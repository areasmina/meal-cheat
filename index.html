<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Cheat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column, one job per screen, thumb tab bar at the bottom. Built for reading tired, at night, on a phone. */
:root {
  --bg: #0e1116; --surface: #171c24; --surface-2: #212836; --line: #343e4f;
  --fg: #f3f6fa; --muted: #b3bdcc; --accent: #3ddc97; --accent-ink: #062a1b;
  --warn: #ffbe5c; --danger: #ff7a7a; --treat: #f29bff; --treat-ink: #2d0631;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 16px; --tap: 52px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eceff3; --line: #cfd6df;
    --fg: #111722; --muted: #4a5566; --accent: #0b7d53; --accent-ink: #ffffff;
    --warn: #8a4b00; --danger: #b42318; --treat: #93208f; --treat-ink: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eceff3; --line: #cfd6df;
  --fg: #111722; --muted: #4a5566; --accent: #0b7d53; --accent-ink: #ffffff;
  --warn: #8a4b00; --danger: #b42318; --treat: #93208f; --treat-ink: #ffffff;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: var(--fs-md); line-height: 1.45; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding-block: 10px; }
.brand { font-weight: 700; font-size: var(--fs-md); letter-spacing: .01em; }
.left-pill { font-size: var(--fs-sm); font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.left-pill.over { color: var(--danger); }

main { padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px)); }
.screen { display: grid; gap: var(--sp-4); }
h1 { font-size: var(--fs-2xl); line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: var(--fs-lg); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: var(--fs-md); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: var(--sp-3); min-width: 0; }
.card.ready { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.card.treat { border-color: var(--treat); }
.meta { color: var(--muted); font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.meta b { color: var(--fg); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: var(--fs-sm); font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.tag.ok { color: var(--accent); }
.tag.miss { color: var(--warn); }
.steps { margin: 0; color: var(--fg); font-size: var(--fs-md); }

/* Buttons */
.btn { text-decoration: none; min-height: var(--tap); border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); padding: 12px 18px; font-weight: 700; font-size: var(--fs-md); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.treat { background: var(--treat); color: var(--treat-ink); border-color: transparent; }
.btn.danger { color: var(--danger); background: transparent; }
.btn.block { width: 100%; }
.btn.small { min-height: 44px; font-size: var(--fs-sm); padding: 8px 14px; }
.row { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
.row > .btn { flex: 1 1 140px; }

/* Energy picker */
.energy { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
.energy button { min-height: 92px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); padding: 10px 8px; display: grid; gap: 2px; align-content: center; text-align: center; }
.energy button strong { font-size: var(--fs-md); }
.energy button span { font-size: var(--fs-sm); color: var(--muted); }
.energy button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }

/* Status strip */
.status { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat .n { font-size: var(--fs-xl); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: var(--fs-sm); }
.banner { border-radius: var(--radius); padding: 14px 16px; background: color-mix(in srgb, var(--treat) 18%, var(--surface)); border: 1px solid var(--treat); font-size: var(--fs-md); }

/* Disclosure */
details.more { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.more > summary { min-height: var(--tap); padding: 14px 18px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-size: var(--fs-xl); color: var(--muted); }
details.more[open] > summary::after { content: "–"; }
details.more > .inner { padding: 0 18px 18px; display: grid; gap: var(--sp-3); }
details.how > summary { color: var(--accent); font-weight: 700; cursor: pointer; min-height: 40px; display: flex; align-items: center; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.chip { min-height: 46px; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-size: var(--fs-md); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); font-weight: 700; }
.chip[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); }
.group-label { font-size: var(--fs-sm); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 0; }

/* Lists */
.list { display: grid; gap: 0; }
.item { display: flex; align-items: center; gap: var(--sp-3); padding: 10px 0; border-bottom: 1px solid var(--line); min-height: var(--tap); }
.item:last-child { border-bottom: 0; }
.item label { flex: 1; display: flex; align-items: center; gap: var(--sp-3); min-width: 0; cursor: pointer; }
.item input[type="checkbox"] { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
.item .name { overflow-wrap: anywhere; }
.item.done .name { text-decoration: line-through; color: var(--muted); }
.item .amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.x { width: 44px; height: 44px; border-radius: var(--r-sm); border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: var(--fs-lg); flex: none; }

/* Forms */
.field { display: grid; gap: var(--sp-2); }
.field label { font-weight: 700; font-size: var(--fs-sm); }
.input { min-height: var(--tap); border-radius: var(--r); border: 2px solid var(--line); background: var(--bg); padding: 10px 14px; width: 100%; min-width: 0; }
.input:focus { border-color: var(--accent); outline: none; }
.form-row { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
.form-row > * { flex: 1 1 140px; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 32px; }
.slider-head { display: flex; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-md); }
.slider-head b { font-variant-numeric: tabular-nums; }

/* Money */
.big-left { font-size: var(--fs-3xl); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; }
.legend { display: grid; gap: var(--sp-2); font-size: var(--fs-sm); }
.legend div { display: flex; justify-content: space-between; gap: var(--sp-3); }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 8px; vertical-align: -1px; }
.warn { color: var(--warn); font-weight: 700; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.quick .btn { min-height: 64px; flex-direction: column; gap: 0; }
.quick .btn small { font-weight: 400; font-size: var(--fs-sm); }

/* Week */
.day { display: grid; gap: var(--sp-2); }
.day.today { border-color: var(--accent); }
.day-head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding-block: 6px; }
.tabbar button { min-height: 60px; border: 0; background: transparent; border-radius: var(--r); display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: var(--fs-xs); font-weight: 700; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* Toast + dialog */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: var(--r); font-weight: 700; max-width: calc(100% - 32px); text-align: center; }
.dialog-back { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; width: 100%; max-width: 480px; display: grid; gap: var(--sp-4); }
.dialog p { margin: 0; font-size: var(--fs-md); }
/* Simple mode */
.hero { gap: var(--sp-4); padding: 20px; }
.hero .eyebrow { margin: 0; color: var(--accent); font-weight: 700; font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .06em; }
.hero .hero-title { font-size: var(--fs-xl); line-height: 1.2; }
.btn.big { min-height: 64px; font-size: var(--fs-lg); }
.hint { border-color: var(--accent); padding: 12px 14px; gap: 4px 10px; grid-template-columns: 1fr auto; align-items: center; }
.hint .hint-ok { grid-row: 1; grid-column: 2; }
.hint-note { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: var(--fs-sm); }
.hint-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); color: var(--muted); font-size: var(--fs-sm); }
.hint-foot .btn { flex: none; }
.hint-steps { margin: 0; padding-left: 24px; display: grid; gap: 2px; font-size: var(--fs-md); }
.link-btn { background: none; border: 0; color: var(--muted); font-size: var(--fs-md); text-decoration: underline; text-underline-offset: 3px; padding: 12px 4px; min-height: 48px; text-align: left; }
.menu { display: grid; gap: var(--sp-3); }
.menu-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); width: 100%; min-height: 72px; padding: 14px 16px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--fg); font-size: var(--fs-md); }
.menu-row span:first-child { display: grid; gap: 2px; min-width: 0; }
.menu-row small { color: var(--muted); font-size: var(--fs-sm); }
.menu-row > span:last-child { font-size: var(--fs-xl); color: var(--muted); }
.back { justify-self: start; margin-bottom: 8px; }
/* Video library */
.vid-search { width: 100%; min-height: 52px; font-size: var(--fs-md); padding: 10px 14px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); color: var(--fg); }
.vid-wrap { display: grid; gap: var(--sp-3); }
.vids { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--sp-2); }
.vid { display: flex; gap: var(--sp-3); align-items: center; justify-content: space-between; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.vid a { color: var(--fg); text-decoration: none; font-size: var(--fs-md); line-height: 1.35; overflow-wrap: anywhere; min-width: 0; flex: 1; }
.vid a:hover { text-decoration: underline; }
.vid .btn { flex: none; }
/* Cook mode */
.cook { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.cook .wrap { display: grid; gap: var(--sp-4); padding-block: 16px; }
.cook-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); }
.cook h1 { font-size: var(--fs-xl); }
.cook ol, .cook ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--sp-3); }
.step { display: flex; gap: var(--sp-4); align-items: flex-start; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; font-size: var(--fs-lg); line-height: 1.4; text-align: left; width: 100%; }
.step .num { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-size: var(--fs-md); }
.step[aria-pressed="true"] { opacity: .55; border-color: var(--accent); }
.step[aria-pressed="true"] .num { background: var(--accent); color: var(--accent-ink); }
.step[aria-pressed="true"] .num::after { content: "✓"; }
.step[aria-pressed="true"] .num span { display: none; }
.need { font-size: var(--fs-md); }
.video-btn { background: #c8261b; color: #fff; border-color: transparent; }
.match-note { font-size: var(--fs-sm); color: var(--muted); margin: -6px 0 0; }

/* ===== v7 visual layer: warmer identity, depth, motion ===== */
:root { --warm: #ff9f43; --glow: color-mix(in srgb, var(--accent) 35%, transparent); }
body {
  background:
    radial-gradient(900px 500px at -10% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(700px 500px at 110% 0%, color-mix(in srgb, var(--warm) 14%, transparent), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
.topbar, .tabbar { background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }
.brand { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-md); }
.brand .logo { font-size: var(--fs-lg); }
.left-pill { display: inline-flex; align-items: center; gap: var(--sp-2); padding: 5px 12px 5px 6px; }
.card { background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 92%, var(--fg) 8%), var(--surface) 38%); box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 6%, transparent) inset, 0 10px 30px -18px rgba(0,0,0,.55); }
.btn { transition: transform .08s ease, box-shadow .2s ease, background-color .2s ease; }
.btn:active, .chip:active, .energy button:active, .menu-row:active, .step:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #4cc9ff)); box-shadow: 0 10px 24px -10px var(--glow); }
.btn.big { letter-spacing: .01em; }

.energy button { position: relative; overflow: hidden; transition: border-color .2s, background-color .2s, transform .08s; }
.energy button .em { font-size: var(--fs-lg); line-height: 1; }
.energy button { min-height: 80px; padding: 8px 6px; }
.energy button strong { font-size: var(--fs-md); white-space: nowrap; }
.energy button[aria-pressed="true"] { box-shadow: 0 8px 22px -12px var(--glow); }

/* Food icons */
.food-ic { flex: none; width: 58px; height: 58px; border-radius: var(--r-lg); display: grid; place-items: center; font-size: var(--fs-2xl); line-height: 1;
  background: linear-gradient(145deg, color-mix(in srgb, var(--warm) 26%, var(--surface-2)), var(--surface-2)); box-shadow: 0 6px 16px -10px rgba(0,0,0,.6); }
.food-ic.sm { width: 46px; height: 46px; border-radius: var(--r); font-size: var(--fs-xl); }
.title-row { display: flex; align-items: center; gap: var(--sp-4); min-width: 0; }
.title-row > div { min-width: 0; display: grid; gap: var(--sp-1); }
.hero.swap .title-row, .hero.swap .meta { animation: swapIn .35s cubic-bezier(.2,.8,.2,1); }
@keyframes swapIn { from { opacity: 0; transform: translateX(14px); } }

/* Screen changes */
.enter { animation: enter .34s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } }
.cook.sheet-in { animation: sheet .34s cubic-bezier(.2,.8,.2,1); }
@keyframes sheet { from { opacity: 0; transform: translateY(40px); } }

/* Budget ring */
.ring { display: block; transform: rotate(-90deg); }
.ring .track { stroke: color-mix(in srgb, var(--fg) 14%, transparent); }
.ring .arc { transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1), stroke .3s; animation: ringIn 1s cubic-bezier(.2,.8,.2,1); }
@keyframes ringIn { from { stroke-dashoffset: 100; } }
.money-hero { display: grid; grid-template-columns: 140px 1fr; gap: var(--sp-4); align-items: center; }
.ring-wrap { position: relative; width: 140px; height: 140px; }
.ring-wrap .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-wrap .center b { font-size: var(--fs-xl); line-height: 1; font-variant-numeric: tabular-nums; }
.ring-wrap .center span { font-size: var(--fs-xs); color: var(--muted); }

/* Cooking timer */
.cook li { display: grid; gap: var(--sp-2); }
.timer-btn { justify-self: start; min-height: 44px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--warm) 60%, var(--line)); background: color-mix(in srgb, var(--warm) 14%, var(--surface)); padding: 6px 14px; font-weight: 700; font-size: var(--fs-sm); }
.timer-chip { position: fixed; z-index: 35; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: var(--sp-3);
  padding: 8px 8px 8px 10px; border-radius: 999px; background: var(--surface); border: 2px solid var(--warm); box-shadow: 0 14px 34px -14px rgba(0,0,0,.7); max-width: calc(100% - 32px); }
.timer-chip .t { font-size: var(--fs-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
.timer-chip .l { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.timer-chip button { min-width: 44px; min-height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: var(--fs-lg); }
.timer-chip.done { border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 25%, transparent); } }

/* Panda gallery */
.panda-grid { display: grid; gap: var(--sp-4); }
@media (min-width: 640px) { .panda-grid { grid-template-columns: 1fr 1fr; } }
.panda-card { justify-items: center; text-align: center; }
.panda-card.chosen { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 16px 40px -20px var(--glow); }
.panda-stage { width: 220px; height: 220px; position: relative; display: grid; place-items: center; cursor: pointer; border-radius: 50%;
  background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--warm) 22%, transparent), transparent 70%); }
.panda-stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.panda-fallback { font-size: 96px; line-height: 1; }
.panda-stage.has-3d .panda-fallback { display: none; }
/* Family + guide */
:root { --me: var(--accent); }
.top-right { display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.who { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 44px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 2px solid var(--me); background: var(--surface); font-weight: 700; font-size: var(--fs-sm); max-width: 130px; }
.who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

:root {

const FRESH_WORDS = ['salad', 'baguette', 'bread', 'bocconcini', 'cheese', 'tomato', 'gyoza', 'fresh', 'lettuce', 'herb', 'pepper', 'banana', 'plantain', 'croissant', '% milk'];
const PROTEIN_WORDS = ['chicken', 'thigh', 'breast', 'shrimp', 'sausage', 'egg', 'tuna', 'beef', 'pork', 'protein', 'charcuterie', 'fish'];

// ==================== HELPERS ====================
// Every user-typed value goes through esc() before it is placed in innerHTML.
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function money(n) { return '$' + (Number(n) || 0).toFixed(2); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function startOfMonth(d = new Date()) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfWeek(d = new Date()) { // weeks start Monday
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  s.setDate(s.getDate() - ((s.getDay() + 6) % 7));
  return s;
}
function spendDate(s) { const t = new Date(s.iso); return isNaN(t) ? new Date() : t; }
function spendsSince(start) { return state.spends.filter(s => spendDate(s) >= start); }
function sum(list) { return list.reduce((t, s) => t + (Number(s.amount) || 0), 0); }

function guessCategory(name) {
  const n = name.toLowerCase();
  if (n.includes('crumb') || n.includes('noodle') || n.includes('coconut') || n.includes('soy sauce')) return 'Pantry & Instant Pot';
  if (FRESH_WORDS.some(w => n.includes(w))) return 'Eat-First Fresh';
  if (PROTEIN_WORDS.some(w => n.includes(w))) return 'Proteins';
  return 'Pantry & Instant Pot';
}

// ==================== STATE ====================

function loadState() {
  const fresh = clone(DEFAULT_STATE); // never share arrays with DEFAULT_STATE
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return fresh;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return fresh;
    const merged = { ...fresh, ...parsed };
    // Type-check everything that came from storage.
    for (const key of Object.keys(fresh)) {
      if (Array.isArray(fresh[key]) && !Array.isArray(merged[key])) merged[key] = fresh[key];
      if (typeof fresh[key] === 'number' && !Number.isFinite(Number(merged[key]))) merged[key] = fresh[key];
      if (typeof fresh[key] === 'number') merged[key] = Number(merged[key]);
    }
    // v3: bring in the new ingredient chips without touching the person's own.
    if ((Number(parsed.stateVersion) || 0) < STATE_VERSION) {
      fresh.currentIngredients.forEach(i => { if (!merged.currentIngredients.includes(i)) merged.currentIngredients.push(i); });
      merged.stateVersion = STATE_VERSION;
    }
    if (!DAYS.includes(merged.cheatDay)) merged.cheatDay = fresh.cheatDay;
    merged.schedule = { ...fresh.schedule, ...(parsed.schedule && typeof parsed.schedule === 'object' ? parsed.schedule : {}) };
    merged.setupDone = parsed.setupDone === true;
    merged.showIntro = parsed.showIntro === undefined ? parsed.setupDone !== true : parsed.showIntro === true;
    merged.introStep = 0;
    // Migrate old spends that only had a locale date string.
    merged.spends = merged.spends
      .filter(s => s && Number(s.amount) > 0)
      .map(s => {
        if (!s.iso) {
          const t = Date.parse(s.date);
          s.iso = isNaN(t) ? new Date().toISOString() : new Date(t).toISOString();
        }
        return s;
      });
    return merged;
  } catch (e) {
    return fresh;
  }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function addSpend(category, amount, note) {
  state.spends.push({ id: newId('s_'), category, amount, note: note || category, iso: new Date().toISOString() });
}


function monthSpent() { return sum(spendsSince(startOfMonth())); }
function pizzasLeftThisWeek() {
  const used = spendsSince(startOfWeek()).filter(s => s.category === 'Pizza Pickup').length;
  return Math.max(0, state.pizzaPerWeek - used);
}

function cheatsLeftThisMonth() {
  const used = spendsSince(startOfMonth()).filter(s => s.category === 'Cheat Day').length;
  return Math.max(0, state.cheatPerMonth - used);
}
function todayName() { return DAYS[(new Date().getDay() + 6) % 7]; }
function daysUntil(dayName) {
  const diff = (DAYS.indexOf(dayName) - DAYS.indexOf(todayName()) + 7) % 7;
  return diff;
}

RECIPE_LIBRARY.forEach(r => { const d = DETAILS[r.id]; if (d) { Object.assign(r, d); if (d.video) r.video = d.video; else delete r.video; } });

let state = loadState();
const SUBS = ['meals', 'batch', 'kitchen', 'money', 'week', 'family', 'person', 'takeout', 'garden', 'schedule'];
if (['kitchen', 'money', 'week'].includes(state.uiTab)) { state.uiSub = state.uiTab; state.uiTab = 'more'; }
if (!['eat', 'plan', 'shop', 'more'].includes(state.uiTab)) state.uiTab = 'eat';
if (!SUBS.includes(state.uiSub)) state.uiSub = null;
state.uiPick = Number.isInteger(state.uiPick) && state.uiPick >= 0 ? state.uiPick : 0;
let _profilesReady = false;
if (!['zero', 'low', 'some'].includes(state.selectedEnergy)) state.selectedEnergy = 'zero';
if (!state.uiMealFilter) state.uiMealFilter = 'all';

// ==================== SMALL HELPERS ====================
const $ = (sel) => document.querySelector(sel);
const view = () => document.getElementById('view');

function ask(message, yesLabel = 'Yes') {
  return new Promise(resolve => {
    const back = document.activeElement;
    const dlg = document.getElementById('dialog');
    document.getElementById('dialogText').textContent = message;
    const yes = document.getElementById('dialogYes');
    const no = document.getElementById('dialogNo');
    yes.textContent = yesLabel;
    dlg.hidden = false;
    const done = (v) => {
      dlg.hidden = true; yes.onclick = no.onclick = null;
      document.removeEventListener('keydown', onKey);
      if (back && back.focus) back.focus();
      resolve(v);
    };
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
    document.addEventListener('keydown', onKey);
    no.focus();
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

function budget() {
  const pizzaMonthly = state.pizzaPerWeek * state.pizzaPrice * WEEKS_PER_MONTH;
  const cheatMonthly = state.cheatPerMonth * state.cheatPrice;
  const groceryMonthly = state.budgetCap - pizzaMonthly - cheatMonthly;
  return { pizzaMonthly, cheatMonthly, groceryMonthly, groceryWeekly: groceryMonthly / WEEKS_PER_MONTH };
}

function scoreRecipes(list) {
  const have = new Set(state.selectedIngredients || []);
  return list
    .map(r => ({ ...r, missing: r.ingredients.filter(i => !have.has(i)) }))
    .sort((a, b) => a.missing.length - b.missing.length || a.cost - b.cost);
}

const ENERGY_TEXT = {
  zero: { name: 'Wiped out', hint: '2 min' },
  low: { name: 'A bit tired', hint: '5 min' },
  some: { name: "I'm OK", hint: '10 min' }
};

function mealCard(r) {
  const ready = r.missing.length === 0;
  return `
    <button type="button" class="card meal-row${ready ? ' ready' : ''}" data-action="cook" data-id="${esc(r.id)}">
      <span class="food-ic sm dish-ic" aria-hidden="true">${dishSvg(r)}</span>
      <span class="mr-main"><strong>${esc(r.title)}</strong>
        <span class="meta"><span><b>${esc(r.time)}</b></span><span>about <b>${money(r.cost)}</b></span></span>
        ${ready ? '<span class="tag ok">You have it all</span>' : `<span class="tag miss">Need: ${esc(r.missing.join(', '))}</span>`}
        ${r.portions ? `<span class="save">💚 ${r.portions} portions save about ${money(Math.max(0, (15 - r.cost) * r.portions))} vs $15 takeout meals</span>` : ''}</span>
      <span class="chev" aria-hidden="true">›</span>
    </button>`;
}

// ==================== SCREENS ====================
function screenEat() {
  const energy = state.selectedEnergy;
  const mine = RECIPE_LIBRARY.filter(x => x.energy === energy && okFor(x));
  const picks = rankRecipes(mine.length ? mine : RECIPE_LIBRARY.filter(x => x.energy === energy));
  const r = picks[state.uiPick % picks.length];
  const ready = r.missing.length === 0;
  const isCheatDay = todayName() === state.cheatDay && state.cheatPerMonth > 0;
  const cheatsLeft = cheatsLeftThisMonth();
  const pizzasLeft = pizzasLeftThisWeek();

  return `
  <section class="screen" aria-labelledby="eatTitle">
    ${guideHtml(r)}

    ${isCheatDay ? `<div class="banner"><b>Today is Cheat Day.</b> ${cheatsLeft > 0 ? `${money(state.cheatPrice)} is set aside for a treat.` : 'This month\'s treats are used up.'}

function makeIcs() {
  const d = new Date(); const ymd = dayKey(d).replace(/-/g, '');
  const ev = (uid, hms, rule, summary) => ['BEGIN:VEVENT', `UID:${uid}@meal-cheat`, `DTSTAMP:${ymd}T000000`, `DTSTART:${ymd}T${hms}`, 'DURATION:PT10M', `RRULE:${rule}`, `SUMMARY:${summary}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${summary}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT'];
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Meal Cheat//EN',
    ...ev('breakfast', hmsOf(state.schedule.breakfast, '080000'), 'FREQ=DAILY', 'Meal Cheat: breakfast'),
    ...ev('lunch', hmsOf(state.schedule.lunch, '123000'), 'FREQ=DAILY', 'Meal Cheat: lunch'),
    ...ev('dinner', hmsOf(state.schedule.dinner, '180000'), 'FREQ=DAILY', 'Meal Cheat: dinner'),
    ...ev('groceries', hmsOf(state.schedule.groceryTime, '170000'), `FREQ=WEEKLY;BYDAY=${DAY_CODE[state.schedule.groceryDay] || 'SU'}`, 'Meal Cheat: Walmart order'),
    'END:VCALENDAR'];
  return lines.join('\r\n');
}

const cookTicks = {};

  if (done === 0) return `🐼 ${esc(pn)}: Tap each step when it's done. I'll keep count.`;

  if (vessel === 'bread') { out.push(`<rect x="16" y="38" width="68" height="24" rx="12" fill="#d99a45" stroke="#b9772c" stroke-width="1.5"/>`); for (let i = 0; i < 4; i++) out.push(`<path d="M${28 + i * 13} 42 l6 16" stroke="#f3c98a" stroke-width="2.5"/>`); out.push(`<path d="M20 50 h60" stroke="${has(/tuna/) ? '#f4b183' : has(/caprese|bocconcini|cheese/) ? '#fffbea' : '#f0c27a'}" stroke-width="4" opacity=".9"/>`); }
  const egg = (x, y, s = 1) => out.push(`<path d="M${x - 13 * s} ${y} q${2 * s} ${-12 * s} ${13 * s} ${-12 * s} q${12 * s} 0 ${13 * s} ${11 * s} q${-1 * s} ${13 * s} ${-14 * s} ${12 * s} q${-13 * s} ${-1 * s} ${-12 * s} ${-11 * s}z" fill="#fff"/><circle cx="${x}" cy="${y}" r="${5.5 * s}" fill="#ffb627"/><circle cx="${x - 1.6 * s}" cy="${y - 1.8 * s}" r="${1.6 * s}" fill="#ffe08a"/>`);
  if (has(/huevos|eggs in sauce|skillet/)) { egg(38, 44, .85); egg(60, 58, .85); if (has(/sausage/)) ring(6, 30, (x, y) => out.push(`<circle cx="${x}" cy="${y}" r="5" fill="#b5452b"/><circle cx="${x}" cy="${y}" r="3" fill="#d9734f"/>`)); }
  else if (has(/egg|oyakodon/) && vessel !== 'wrap' && vessel !== 'bread') egg(56, 46, has(/oyakodon/) ? .9 : 1);
  if (has(/chicken|thigh|milanesa|rotisserie|nugget/) && !has(/fried rice/) && vessel !== 'wrap' && vessel !== 'bread') ring(has(/milanesa|thigh/) ? 3 : 6, 26, (x, y, a) => out.push(`<rect x="${x - (has(/milanesa|thigh/) ? 11 : 6)}" y="${y - (has(/milanesa|thigh/) ? 7 : 4)}" width="${has(/milanesa|thigh/) ? 22 : 12}" height="${has(/milanesa|thigh/) ? 14 : 8}" rx="${has(/milanesa/) ? 3 : 4}" transform="rotate(${a * 57} ${x} ${y})" fill="${has(/milanesa/) ? '#d68a2e' : '#c7843f'}" stroke="#a8692b" stroke-width="1"/>`));
  if (has(/fried rice/)) { ring(10, 30, (x, y) => out.push(`<rect x="${x - 2}" y="${y - 2}" width="4" height="4" fill="#ff8a3d"/>`), 3); ring(10, 30, (x, y) => out.push(`<circle cx="${x}" cy="${y}" r="2" fill="#52b043"/>`), 3); ring(6, 24, (x, y) => out.push(`<rect x="${x - 4}" y="${y - 3}" width="8" height="6" rx="2" fill="#c7843f"/>`)); ring(5, 26, (x, y) => out.push(`<ellipse cx="${x}" cy="${y}" rx="4" ry="2.4" fill="#ffd35a"/>`)); }
  if (has(/beef|steak|bulgogi/)) ring(9, 26, (x, y, a) => out.push(`<path d="M${x - 8} ${y} q8 -5 16 0" stroke="#6b3a24" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(${a * 57} ${x} ${y})"/>`));
  if (has(/shrimp|prawn/) && vessel !== 'wrap') ring(6, 26, (x, y, a) => out.push(`<path d="M${x - 5} ${y - 4} a6 6 0 1 0 9 6" stroke="#ff7b6b" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(${a * 57} ${x} ${y})"/>`));
  if (has(/tuna/) && vessel !== 'bread') ring(7, 22, (x, y) => out.push(`<ellipse cx="${x}" cy="${y}" rx="5" ry="3.4" fill="#e9a07a"/>`));
  if (has(/salmon/)) out.push(`<rect x="34" y="38" width="32" height="20" rx="6" fill="#ff8c69"/><path d="M40 41 v14 M48 41 v14 M56 41 v14" stroke="#ffd1bf" stroke-width="2"/>`);
  if (has(/sausage|hot ?dog/) && !has(/skillet/)) ring(7, 28, (x, y) => out.push(`<circle cx="${x}" cy="${y}" r="5.5" fill="#b5452b"/><circle cx="${x}" cy="${y}" r="3.4" fill="#d9734f"/>`));
  if (has(/gyoza|dumpling/)) ring(5, 22, (x, y, a) => out.push(`<path d="M${x - 10} ${y + 3} q10 -16 20 0 z" fill="#f6e3b5" stroke="#d8b878" stroke-width="1.5" transform="rotate(${a * 57} ${x} ${y})"/>`));
  if (has(/charcuterie/)) { ring(6, 26, (x, y) => out.push(`<circle cx="${x}" cy="${y}" r="6" fill="#b83a4b"/><circle cx="${x + 1}" cy="${y}" r="1.2" fill="#f3c1c8"/>`)); }
  if (has(/bocconcini|caprese|cheese|tuna melt/)) ring(5, 22, (x, y) => out.push(`<circle cx="${x}" cy="${y}" r="4.2" fill="#fffbea" stroke="#efe4c4"/>`));
  if (has(/tomato|caprese|salsa|ranchero|halal/)) ring(5, 30, (x, y) => out.push(`<circle cx="${x}" cy="${y}" r="3.8" fill="#e63946"/><circle cx="${x - 1}" cy="${y - 1}" r="1" fill="#ff9aa2"/>`));
  if (has(/salad|wrap|rotisserie chicken \+|halal/) && vessel !== 'wrap') ring(5, 34, (x, y) => out.push(`<ellipse cx="${x}" cy="${y}" rx="5" ry="3" fill="#6cc04a"/>`));
  if (has(/pepper|fajita/) && vessel !== 'wrap') ring(6, 26, (x, y, a) => out.push(`<rect x="${x - 7}" y="${y - 1.6}" width="14" height="3.2" rx="1.6" fill="${['#e74c3c', '#f1c40f', '#ff8a3d'][Math.floor(rnd() * 3)]}" transform="rotate(${a * 57} ${x} ${y})"/>`));
  if (has(/onion|bulgogi|chow mein|beef and onion|soy|garlic|oyakodon|egg rice|gyoza|halal/)) ring(8, 30, (x, y) => out.push(`<circle cx="${x}" cy="${y}" r="2" fill="none" stroke="#52b043" stroke-width="1.6"/>`), 4);
  if (has(/bulgogi|soy butter|sesame|kewpie/)) ring(14, 28, (x, y) => out.push(`<ellipse cx="${x}" cy="${y}" rx="1" ry=".6" fill="#fff7dc"/>`), 4);
  if (has(/kewpie|tuna crunch|sriracha|halal/)) out.push(`<path d="M30 40 q10 8 20 0 t20 0" stroke="#fff3c4" stroke-width="2.4" fill="none"/><path d="M30 60 q10 -8 20 0 t20 0" stroke="#e74c3c" stroke-width="2" fill="none" opacity=".85"/>`);
  out.push(`<ellipse cx="34" cy="28" rx="12" ry="5" fill="#fff" opacity=".18" transform="rotate(-30 34 28)"/>`);
  return (DISH_CACHE[r.id] = `<svg class="dish" viewBox="0 0 100 100" aria-hidden="true">${out.join('')}</svg>`);
}

function loadThree() {

    try { const c = document.createElement('canvas'); if (!(c.getContext('webgl') || c.getContext('experimental-webgl'))) return rej(new Error('no webgl')); } catch (e) { return rej(e); }
    const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    const srcs = [window.MEAL_THREE_SRC, CDN].filter(Boolean); // bundled copy first, then the CDN

      const src = srcs.shift(); if (!src) { loadThree.p = null; return rej(new Error('load failed')); }
      const sc = document.createElement('script'); sc.src = src; sc.async = true; if (/^https:/.test(src)) sc.crossOrigin = 'anonymous';
      sc.onload = () => window.THREE ? res(window.THREE) : tryNext(); sc.onerror = () => { sc.remove(); tryNext(); };
      document.head.appendChild(sc);

}

function buildPanda(T, kind) {
  const toon = kind === 'bamboo';

  const M = (color, extra = {}) => toon ? new T.MeshToonMaterial({ color, ...extra }) : new T.MeshStandardMaterial({ color, roughness: .62, metalness: 0, ...extra });
  const WHITE = M(0xfbfaf7, glow ? { emissive: 0xffe9c7, emissiveIntensity: .38 } : {});

    for (const s of [-1, 1]) {

      if (sleepy) { const lid = new T.Mesh(new T.TorusGeometry(.11, .025, 8, 16, Math.PI), SHINE); lid.position.set(s * .4, .0, 1.0); lid.rotation.z = Math.PI; head.add(lid); }

      blob(PINK, s * .7, -.26, .74, .19, .12, .06, head);
    }
    blob(BLACK, 0, -.17, 1.0, .1, .07, .07, head);
    const mouth = new T.Mesh(new T.TorusGeometry(.07, .018, 8, 16, Math.PI), BLACK); mouth.position.set(0, -.27, 1.0); mouth.rotation.z = Math.PI; head.add(mouth);

  const parts = {};

    blob(WHITE, 0, -1.25, -.2, 1.65, .9, 1.25);           // squishy lying body
    blob(BLACK, -1.25, -1.45, .55, .32, .22, .3); blob(BLACK, 1.25, -1.45, .55, .32, .22, .3); // front paws
    blob(BLACK, 0, -1.2, -1.3, .9, .5, .35);              // back band
    head.position.set(0, -.55, .55); head.scale.setScalar(.95); face(true);
  } else if (kind === 'chef') {
    blob(WHITE, 0, -1.4, 0, .95, .9, .85);
    blob(BLACK, -.55, -2.05, .45, .36, .26, .4); blob(BLACK, .55, -2.05, .45, .36, .26, .4);    // feet forward (sitting)
    blob(BLACK, -.85, -1.25, .2, .26, .45, .26, g, .5);
    parts.arm = new T.Group(); parts.arm.position.set(.8, -.95, .2); g.add(parts.arm); blob(BLACK, .18, .3, 0, .26, .45, .26, parts.arm, -.4);
    const scarf = new T.Mesh(new T.TorusGeometry(.7, .16, 12, 28), M(0xe63946)); scarf.rotation.x = Math.PI / 2; scarf.position.y = -.72; g.add(scarf);
    face(false);
    const hat = new T.Group(); hat.position.set(0, .95, 0); head.add(hat);
    const band = new T.Mesh(new T.CylinderGeometry(.62, .62, .32, 24), M(0xffffff)); hat.add(band);
    [[0, .45, 0, .55], [-.35, .38, 0, .38], [.35, .38, 0, .38], [0, .4, -.3, .4]].forEach(([x, y, z, r]) => blob(M(0xffffff), x, y, z, r, r * .85, r, hat));
  } else { // bao and bamboo: standing chibi
    blob(WHITE, 0, -1.35, 0, .82, .8, .75);
    blob(BLACK, -.42, -2.05, .1, .28, .25, .3); blob(BLACK, .42, -2.05, .1, .28, .25, .3);
    blob(BLACK, -.7, -1.2, .35, .24, .38, .24, g, .9); blob(BLACK, .7, -1.2, .35, .24, .38, .24, g, -.9);
    face(false);
    if (kind === 'bao') {
      const prof = [[0, -.2], [.3, -.2], [.42, -.05], [.5, .15], [.46, .17], [.36, 0], [0, -.08]].map(([x, y]) => new T.Vector2(x, y));

      blob(M(0xfffbea), 0, -1.13, .82, .42, .14, .42);
    } else {
      parts.bamboo = new T.Group(); parts.bamboo.position.set(.35, -1.0, .75); parts.bamboo.rotation.z = .5; g.add(parts.bamboo);
      for (let i = 0; i < 3; i++) { const c = new T.Mesh(new T.CylinderGeometry(.09, .09, .42, 12), M(0x6cc04a)); c.position.y = i * .45; parts.bamboo.add(c); const ring = new T.Mesh(new T.CylinderGeometry(.11, .11, .05, 12), M(0x3f8f2c)); ring.position.y = i * .45 + .22; parts.bamboo.add(ring); }

    const happy = mood === 'happy';
    if (mood === 'sleepy') { t *= .45; head.rotation.x = .22; } else head.rotation.x = mood === 'perky' ? -.08 : 0;
    if (mood === 'perky') t *= 1.5;

    else { g.position.y = Math.abs(Math.sin(t * (happy ? 7 : 2.2))) * (happy ? .35 : .08); head.rotation.z = Math.sin(t * 1.3) * .08; }
    if (parts.arm) parts.arm.rotation.z = .4 + Math.sin(t * (happy ? 12 : 5)) * .45;

// One small 3D stage per canvas. Used by the panda gallery and, later, the guide.
const PandaStage = (() => {
  const stages = new Set(); let raf = 0, guide = null, guideWant = null, adopting = false;
  function make(T, host, kind, size) {
    const r = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); r.setSize(size, size, false);
    const scene = new T.Scene(); const cam = new T.PerspectiveCamera(30, 1, .1, 50); if (kind === 'chef') { cam.position.set(0, .4, 9.6); cam.lookAt(0, -.3, 0); } else { cam.position.set(0, .3, 8.6); cam.lookAt(0, -.55, 0); }
    scene.add(new T.HemisphereLight(0xffffff, 0x4a4560, kind === 'bamboo' ? 1.1 : .9));
    const d = new T.DirectionalLight(0xffffff, .8); d.position.set(3, 5, 6); scene.add(d);
    const p = buildPanda(T, kind); scene.add(p.group);
    host.appendChild(r.domElement); host.classList.add('has-3d');
    const st = { r, scene, cam, p, host, mood: 'idle', moodUntil: 0 }; stages.add(st); loop();
    useBlenderPanda(T, st, kind);
    return st;
  }
  function frame(now) {
    raf = 0; const t = now / 1000;
    for (const st of [...stages]) {
      if (!st.host.isConnected) { st.r.dispose(); st.r.forceContextLoss && st.r.forceContextLoss(); stages.delete(st); continue; }
      if (st.moodUntil && t > st.moodUntil) { st.mood = st.baseMood || 'idle'; st.moodUntil = 0; }
      st.p.update(REDUCED ? 0 : t, st.mood);
      st.p.group.rotation.y = REDUCED ? .25 : Math.sin(t * .6) * .45;
      st.r.render(st.scene, st.cam);
    }
    if (stages.size && !REDUCED && !document.hidden) raf = requestAnimationFrame(frame);
  }
  function loop() { if (!raf) raf = requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loop(); });
  return {
    mount(host, kind, size) { return loadThree().then(T => make(T, host, kind, size)).catch(() => null); },
    cheer(host) { for (const st of stages) if (!host || st.host === host) { st.mood = 'happy'; st.moodUntil = performance.now() / 1000 + 1.6; } loop(); },
    // The guide on the Eat screen keeps one canvas and moves it into each new render.
    adopt(host, kind, mood) {
      guideWant = { host, kind, mood };
      if (guide && guide.kind === kind && stages.has(guide)) {
        if (guide.r.domElement.parentNode !== host) host.appendChild(guide.r.domElement);
        host.classList.add('has-3d'); guide.host = host; guide.baseMood = mood; if (!guide.moodUntil) guide.mood = mood; loop(); return;
      }
      if (guide) { guide.host = { isConnected: false }; guide = null; loop(); }
      if (adopting) return; adopting = true;
      loadThree().then(T => {
        adopting = false; const w = guideWant; if (!w || !w.host.isConnected) return;
        guide = make(T, w.host, w.kind, 92); guide.kind = w.kind; guide.baseMood = guide.mood = w.mood;
      }).catch(() => { adopting = false; });
    },
    cheerGuide() { if (guide) { guide.mood = 'happy'; guide.moodUntil = performance.now() / 1000 + 2; loop(); } }
  };
})();

    }
    case 'open-sub': if (SUBS.includes(el.dataset.sub)) { state.uiTab = 'more'; state.uiSub = el.dataset.sub; commit(null, false); window.scrollTo(0, 0); } break;
    case 'more-back': state.uiSub = state.uiSub === 'person' ? 'family' : null; commit(null, false); window.scrollTo(0, 0); break;
    case 'meal-filter': state.uiMealFilter = el.dataset.filter; commit(); break;
    case 'setup-skip': state.setupDone = true; commit(null, false); break;
    case 'intro-next': if (state.introStep < 4) { state.introStep += 1; } else { state.showIntro = false; state.uiTab = 'eat'; state.uiSub = null; } commit(null, false); break;
    case 'intro-back': state.introStep = Math.max(0, state.introStep - 1); commit(null, false); break;
    case 'intro-skip': state.showIntro = false; commit(null, false); break;
    case 'meet-bao': state.showIntro = true; state.introStep = 0; state.uiTab = 'more'; state.uiSub = null; commit(null, false); window.scrollTo(0, 0); break;
    case 'shoot-tap': {
      el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle');
      gardenSay(['Shoots are growing!', 'Tiny sprout. Nice.', 'Bao likes that.'][Math.floor(Math.random() * 3)]);
      celebrate('🎋'); PandaStage.cheerGuide(); break;
    }
    case 'water': {
      gardenUi.water += 1;
      const bar = document.getElementById('waterBar'), cnt = document.getElementById('waterCount');
      if (gardenUi.water >= 5) {
        gardenUi.water = 0; if (bar) bar.style.width = '0%'; if (cnt) cnt.textContent = '5 more';
        celebrate('💧'); PandaStage.cheerGuide(); gardenSay('The bamboo drank up. Bao is proud!');
      } else {
        if (bar) bar.style.width = (gardenUi.water / 5 * 100) + '%';
        if (cnt) cnt.textContent = (5 - gardenUi.water) + ' more';
        gardenSay('Splash! Keep going.');
      }
      break;
    }
    case 'feed': {
      if (el.dataset.food === 'bamboo') { gardenSay('Yum! Bao loves bamboo.'); celebrate('🎋'); PandaStage.cheerGuide(); }
      else {
        gardenSay('Not for pandas. Try the bamboo!');
        const g = document.getElementById('gardenPanda'); if (g) { g.classList.remove('wiggle'); void g.offsetWidth; g.classList.add('wiggle'); }
      }
      break;
    }
    case 'ics-export': {
      const url = URL.createObjectURL(new Blob([makeIcs()], { type: 'text/calendar' }));
      const a = document.createElement('a'); a.href = url; a.download = 'meal-cheat-reminders.ics';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('Calendar file ready. Open it to add the reminders.'); break;
    }
    case 'cook': { const c = document.getElementById('cook'); cookFromVideos = !c.hidden && c.dataset.id === ''; openCook(id); break; }
    case 'cook-close': closeCook(); break;
    case 'videos': openVideos(); break;
    case 'vid-tag': vidUi.tag = el.dataset.tag; vidUi.shown = 40; document.querySelectorAll('[data-action="vid-tag"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); refreshVideos(); break;
    case 'vid-more': vidUi.shown += 60; refreshVideos(); break;
    case 'cook-done': { const cid = document.getElementById('cook').dataset.id; closeCook(); madeRecipe(cid); break; }
    case 'tick': {
      const cid = document.getElementById('cook').dataset.id; const t = cookTicks[cid];
      const i = Number(el.dataset.i); t[el.dataset.kind][i] = !t[el.dataset.kind][i];
      el.setAttribute('aria-pressed', String(!!t[el.dataset.kind][i]));
      const rr = RECIPE_LIBRARY.find(x => x.id === cid); const n = rr && Array.isArray(rr.steps) ? rr.steps.length : 1;
      const cg = document.getElementById('cookGuide'); if (cg) cg.innerHTML = cookGuideText(n, t.steps.filter(Boolean).length);
      break;
    }
    case 'log-pizza': await logPizza(); break;
    case 'log-cheat': await logCheat(); break;
    case 'log-walmart': {
      const amt = Math.round(budget().groceryWeekly);
      addSpend('Walmart+ Groceries', amt, 'Weekly Walmart order');
      commit(`Logged ${money(amt)} Walmart order. Change it in the list below if the total was different.`);
      break;
    }
    case 'show-other': { const f = document.getElementById('otherForm'); f.hidden = !f.hidden; if (!f.hidden) document.getElementById('otherAmt').focus(); break; }
    case 'spend-del': state.spends = state.spends.filter(s => s.id !== id); commit('Deleted.'); break;
    case 'clear-log':
      if (!state.spends.length) return;
      if (await ask(`Delete all ${state.spends.length} logged spendings? This can't be undone.`, 'Delete all')) { state.spends = []; commit('All spending deleted.'); }
      break;
    case 'reset':
      if (await ask('Reset the whole app? Your spending, lists, kitchen and week plan go back to the starting example.', 'Reset')) {
        state = clone(DEFAULT_STATE); _profilesReady = false; state.uiTab = 'eat'; state.uiSub = null; state.uiPick = 0; state.uiMealFilter = 'all'; commit('App reset.', false);
      }
      break;
    case 'toggle-ing': {
      const ing = el.dataset.ing; const i = state.selectedIngredients.indexOf(ing);
      if (i >= 0) state.selectedIngredients.splice(i, 1); else state.selectedIngredients.push(ing);
      commit(); break;
    }
    case 'portion': state.batchPortions = Math.max(0, state.batchPortions + Number(el.dataset.delta)); commit(); break;
    case 'perish-del': state.perishables = state.perishables.filter(p => p.id !== id); commit(); break;
    case 'groc-del': state.groceries = state.groceries.filter(g => g.id !== id); commit(); break;
    case 'uncheck-all': state.groceries.forEach(g => { g.checked = false; }); commit('All items unticked for a new week.'); break;
    case 'copy-list': {
      const src = state.groceries.filter(g => !g.checked);
      copyText((src.length ? src : state.groceries).map(g => `- ${g.name} (~${money(g.price)})`).join('\n'));
      break;
    }
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  const a = el.dataset.action;
  if (a === 'perish-toggle') { const p = state.perishables.find(x => x.id === el.dataset.id); if (p) p.eaten = el.checked; commit(); }
  else if (a === 'groc-toggle') { const g = state.groceries.find(x => x.id === el.dataset.id); if (g) g.checked = el.checked; commit(); }
  else if (a === 'day-type') { state.weekPlan[Number(el.dataset.idx)].type = el.value; saveState(); }
  else if (a === 'day-meal') { state.weekPlan[Number(el.dataset.idx)].meal = el.value.slice(0, 300); saveState(); }
  else if (el.dataset.pf === 'name') { const p = state.profiles.find(x => x.id === state.uiEdit); const v = el.value.trim().slice(0, 20); if (p && v) { p.name = v; commit('Name saved.'); } }
  else if (el.dataset.setting === 'cheatDay') { if (DAYS.includes(el.value)) { state.cheatDay = el.value; commit('Cheat Day saved.'); } }
  else if (el.dataset.setting) { commit(); }
});

// Sliders update live without redrawing the whole screen (so the thumb doesn't jump).
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'vidSearch') { vidUi.q = el.value.slice(0, 60); vidUi.shown = 40; refreshVideos(); return; }
  const key = el.dataset.setting;
  if (!key || el.type !== 'range') return;
  state[key] = Number(el.value);
  const out = document.getElementById(key + 'Val');
  if (out) out.textContent = (['budgetCap', 'pizzaPrice', 'cheatPrice'].includes(key) ? '$' : '') + el.value;
  saveState();
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'add-ing') {
    const v = form.elements.ing.value.trim().slice(0, 60);
    if (!v) return;
    if (!state.currentIngredients.includes(v)) state.currentIngredients.push(v);
    if (!state.selectedIngredients.includes(v)) state.selectedIngredients.push(v);
    commit(`Added ${v}.`);
  } else if (kind === 'add-perish') {
    const v = form.elements.name.value.trim().slice(0, 80);
    if (!v) return;
    state.perishables.push({ id: newId('p_'), name: v, daysLeft: 'Eat first', eaten: false });
    commit(`Added ${v} to Eat first.`);
  } else if (kind === 'add-groc') {
    const name = form.elements.name.value.trim().slice(0, 80);
    const price = parseFloat(form.elements.price.value);
    if (!name) return;
    state.groceries.push({ id: newId('g_'), name, cat: form.elements.cat.value, price: Number.isFinite(price) && price >= 0 ? Math.round(price * 100) / 100 : 0, checked: false });
    commit(`Added ${name}.`);
  } else if (kind === 'schedule') {
    const pick = (k, fb) => { const v = String(form.elements[k].value || '').trim(); return /^\d{2}:\d{2}$/.test(v) ? v : fb; };
    const cur = state.schedule;
    state.schedule = {
      wake: pick('wake', cur.wake), breakfast: pick('breakfast', cur.breakfast), lunch: pick('lunch', cur.lunch), dinner: pick('dinner', cur.dinner),
      shift: String(form.elements.shift.value || '').trim().slice(0, 60),
      groceryDay: DAYS.includes(form.elements.groceryDay.value) ? form.elements.groceryDay.value : cur.groceryDay,
      groceryTime: pick('groceryTime', cur.groceryTime)
    };
    state.setupDone = true;
    commit('Saved. Reminders use your new times.', false);
  } else if (kind === 'add-takeout') {
    const name = form.elements.name.value.trim().slice(0, 60);
    const price = Math.round(parseFloat(form.elements.price.value) * 100) / 100;
    const serves = Math.min(12, Math.max(1, parseInt(form.elements.serves.value, 10) || 1));
    if (!name || !Number.isFinite(price) || price <= 0 || price > 500) { toast('Add a name and a price between $1 and $500.'); return; }
    state.takeout.push({ id: newId('t_'), name, place: form.elements.place.value.trim().slice(0, 40), price, serves, kind: serves > 1 ? 'platter' : 'meal', deal: form.elements.deal.checked, fav: false, example: false });
    commit(`Added ${name}.`);
  } else if (kind === 'log-other') {
    const amt = Math.round(parseFloat(form.elements.amt.value) * 100) / 100;
    if (!Number.isFinite(amt) || amt <= 0 || amt > 1000) { toast('Enter an amount between $0.01 and $1,000.'); return; }
    addSpend(form.elements.cat.value, amt, form.elements.note.value.trim().slice(0, 80));
    commit(`Logged ${money(amt)}.`);
  }
});

render(false);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

</body>
</html>
